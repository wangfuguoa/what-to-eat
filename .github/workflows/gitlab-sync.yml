name: Sync to GitLab

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 只允许 origin(本仓库) 触发，避免 GitLab 推送回来造成循环
    if: github.repository == 'wangfuguoa/what-to-eat'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab-mirror https://oauth2:${GITLAB_TOKEN}@gitlab.com/wangfgwells/what-to-eat.git
          git push --force --prune gitlab-mirror main:main
          echo "Synced to GitLab."
